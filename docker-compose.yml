services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-travel_tools}
      POSTGRES_USER: ${DB_USER:-travel_tools}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_tools}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
