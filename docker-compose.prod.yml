services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-travel_tools}
      POSTGRES_USER: ${DB_USER:-travel_tools}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # to be removed once caddy is configured
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # The command is a PostgreSQL utility that checks whether the database server is accepting connections.
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: traveltools-backend:local
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-travel_tools}
      DB_USER: ${DB_USER:-travel_tools}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # to be removed once caddy is configured
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
