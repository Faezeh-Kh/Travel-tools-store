spring.application.name=travelTools

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travel_tools}
spring.datasource.username=${DB_USER:travel_tools}
spring.datasource.password=${DB_PASSWORD:travel_tools}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A local database seeded under the dev profile has the dev seed (a repeatable migration) in its history.
# Without this, starting the same database without the dev profile fails Flyway validation because that
# migration is "missing". Versioned migrations are still validated strictly.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.cart-cookie.secure=${CART_COOKIE_SECURE:false}
