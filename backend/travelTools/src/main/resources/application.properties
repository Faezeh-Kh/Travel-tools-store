spring.application.name=travelTools

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travel_tools}
spring.datasource.username=${DB_USER:travel_tools}
spring.datasource.password=${DB_PASSWORD:travel_tools}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.cart-cookie.secure=${CART_COOKIE_SECURE:false}
